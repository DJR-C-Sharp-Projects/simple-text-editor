name: Test
description: Unit or integration tests for an existing feature
title: "test(<scope>): "
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is being tested?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- All tests pass with `dotnet test`"
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent issue
      placeholder: "#1"